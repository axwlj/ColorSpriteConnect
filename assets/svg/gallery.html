<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SVG Asset Gallery</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; background: #f0f0f0; }
        .item { background: white; padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #ddd; }
        .item img { display: block; margin: 0 auto 10px; border: 1px solid #eee; }
        .dark { background: #333; color: white; }
    </style>
</head>
<body>
    <div class="item">
        <img src="ic_launcher.svg" width="108">
        <div>ic_launcher.svg</div>
    </div>
    <div class="item dark">
        <img src="ic_launcher_monochrome.svg" width="108" style="color: white;">
        <div>ic_launcher_monochrome.svg</div>
    </div>
    <div class="item">
        <img src="ic_terminal.svg" width="48">
        <div>ic_terminal.svg</div>
    </div>
    <div class="item">
        <img src="ic_sftp.svg" width="48">
        <div>ic_sftp.svg</div>
    </div>
    <div class="item">
        <img src="ic_key.svg" width="48">
        <div>ic_key.svg</div>
    </div>
    <div class="item">
        <img src="ic_tunnel.svg" width="48">
        <div>ic_tunnel.svg</div>
    </div>
    <div class="item">
        <img src="ic_server.svg" width="48">
        <div>ic_server.svg</div>
    </div>
    <div class="item">
        <img src="img_security_hero.svg" width="200">
        <div>img_security_hero.svg</div>
    </div>
</body>
</html>
